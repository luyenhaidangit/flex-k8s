# Deployment: giữ N pod chạy, tự tạo lại khi chết, rolling update khi đổi image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 2
  # Tìm pod theo label; phải khớp template.metadata.labels
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine # ghim version, không dùng latest
          ports:
            - containerPort: 80
          # Readiness: lỗi -> loại khỏi Service (không restart)
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: lỗi -> restart container
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: # đảm bảo, dùng để chọn node
              cpu: 50m
              memory: 32Mi
            limits: # trần: vượt memory -> OOMKilled
              cpu: 200m
              memory: 128Mi
---
# Service: địa chỉ ổn định + cân bằng tải cho các pod
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  type: ClusterIP # chỉ trong cluster; từ máy dùng kubectl port-forward
  selector: # chọn pod theo label; lệch label -> Endpoints trống
    app: nginx
  ports:
    - port: 80 # port của Service
      targetPort: 80 # port của container
