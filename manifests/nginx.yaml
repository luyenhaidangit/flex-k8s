# ConfigMap: cấu hình nginx của Flex, mount vào container. Giai đoạn phát triển: mọi đường dẫn trả trang "Đang xây dựng".
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: nginx
data:
  default.conf: |
    # Giữ scheme gốc (https) do nginx Docker phía trước gửi xuống; không có thì dùng scheme của kết nối.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;
        charset utf-8;
        server_tokens off;

        # Probe của k8s; không phụ thuộc nội dung trang.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API: chuyển nguyên path tới flex-api-gateway (namespace default).
        # proxy_pass viết trực tiếp, KHÔNG dùng biến + resolver: cách đó timeout DNS trên k3s này (502 "could not be resolved").
        # Tên Service được phân giải lúc nginx khởi động, nên phải apply Service flex-api-gateway trước nginx;
        # ClusterIP của Service cố định nên pod gateway restart không ảnh hưởng.
        # Dấu chấm cuối là bắt buộc: pod có ndots:5 và search domain của host có wildcard DNS, thiếu dấu chấm thì tên bị phân giải ra IP public.
        location /api/ {
            proxy_pass http://flex-api-gateway.default.svc.cluster.local.;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location / {
            default_type text/html;
            return 200 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flex</title></head><body style="font-family:sans-serif;display:grid;place-items:center;min-height:100vh;margin:0"><h1>Đang xây dựng</h1></body></html>';
        }
    }
---
# Service: địa chỉ ổn định + cân bằng tải cho các pod
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  type: NodePort # mở cổng 30080 trên host; nginx Docker (flex-environment) proxy tới host.docker.internal:30080
  selector: # chọn pod theo label; lệch label -> Endpoints trống
    app: nginx
  ports:
    - port: 80 # port của Service
      targetPort: 80 # port của container
      nodePort: 30080 # cổng trên host (dải 30000-32767); không mở ra Internet
---
# Deployment: giữ N pod chạy, tự tạo lại khi chết, rolling update khi đổi image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 2
  # Tìm pod theo label; phải khớp template.metadata.labels
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine # ghim version, không dùng latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          # Readiness: lỗi -> loại khỏi Service (không restart)
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: lỗi -> restart container
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: # đảm bảo, dùng để chọn node
              cpu: 50m
              memory: 32Mi
            limits: # trần: vượt memory -> OOMKilled
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
