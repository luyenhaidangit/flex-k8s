# ConfigMap: cấu hình nginx của Flex, mount vào container. Giai đoạn phát triển: mọi đường dẫn trả trang "Đang xây dựng".
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: nginx
data:
  default.conf: |
    # Giữ scheme gốc (https) do nginx Docker phía trước gửi xuống; không có thì dùng scheme của kết nối.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Hỗ trợ WebSocket cho Argo CD.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # Chỉ host flex được vào /argocd; api và các host khác (nginx Docker giữ nguyên Host khi chuyển xuống) nhận 404.
    map $host $argocd_allowed {
        default                  0;
        flex.luyenhaidangit.pro  1;
    }

    server {
        listen 8080; # nginx-unprivileged chạy user thường nên nghe 8080, không bind được cổng < 1024
        server_name _;
        charset utf-8;
        server_tokens off;

        # Probe của k8s; không phụ thuộc nội dung trang.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API: chuyển nguyên path tới flex-api-gateway (namespace default).
        # proxy_pass viết trực tiếp, KHÔNG dùng biến + resolver: cách đó timeout DNS trên k3s này (502 "could not be resolved").
        # Tên Service được phân giải lúc nginx khởi động, nên phải apply Service flex-api-gateway trước nginx;
        # ClusterIP của Service cố định nên pod gateway restart không ảnh hưởng.
        # Dấu chấm cuối là bắt buộc: pod có ndots:5 và search domain của host có wildcard DNS, thiếu dấu chấm thì tên bị phân giải ra IP public.
        location /api/ {
            proxy_pass http://flex-api-gateway.default.svc.cluster.local.;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # DNS của cluster (CoreDNS của k3s, ClusterIP mặc định), chỉ dùng cho /argocd bên dưới.
        resolver 10.43.0.10 valid=30s ipv6=off;

        # Argo CD (namespace argocd): chuyển nguyên path /argocd, argocd-server chạy với server.rootpath=/argocd và HTTP thuần (server.insecure).
        # Khác /api/: proxy_pass dùng biến nên nginx phân giải tên lúc có request, không phải lúc khởi động. Argo CD chưa cài (hoặc đang
        # restart) thì chỉ /argocd trả 502, nginx vẫn chạy bình thường. Biến không kèm URI nên vẫn giữ nguyên path /argocd.
        # Dấu chấm cuối là bắt buộc, cùng lý do với /api/ (resolver của nginx không dùng search domain nhưng giữ cho thống nhất).
        location /argocd {
            if ($argocd_allowed = 0) {
                return 404;
            }
            set $argocd_upstream argocd-server.argocd.svc.cluster.local.;
            proxy_pass http://$argocd_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h; # luồng cập nhật trạng thái app giữ kết nối lâu
            proxy_buffering off;
        }

        location / {
            default_type text/html;
            return 200 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flex</title></head><body style="font-family:sans-serif;display:grid;place-items:center;min-height:100vh;margin:0"><h1>Đang xây dựng</h1></body></html>';
        }
    }
