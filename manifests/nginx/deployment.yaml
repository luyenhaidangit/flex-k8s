# Deployment: giữ N pod chạy, tự tạo lại khi chết, rolling update khi đổi image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 2
  revisionHistoryLimit: 3 # chỉ giữ 3 ReplicaSet cũ để rollback (mặc định 10 làm rối cây Argo CD); không đặt 0 vì mất rollout undo
  # Tìm pod theo label; phải khớp template.metadata.labels
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine # ghim version, không dùng latest; chạy user 101, không root
          ports:
            - containerPort: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          # Readiness: lỗi -> loại khỏi Service (không restart)
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness: lỗi -> restart container
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: # đảm bảo, dùng để chọn node
              cpu: 50m
              memory: 32Mi
            limits: # trần: vượt memory -> OOMKilled
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
