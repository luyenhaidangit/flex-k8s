# ConfigMap: cấu hình không nhạy cảm, nạp vào container qua envFrom
apiVersion: v1
kind: ConfigMap
metadata:
  name: flex-api-gateway-config
  labels:
    app: flex-api-gateway
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Logging__Sinks__Logstash: "false" # chưa có Logstash; 127.0.0.1:5000 trong pod không tồn tại
  JwtSettings__Issuer: "luyenhaidangit"
  JwtSettings__Audience: "flex"
---
# Service: địa chỉ ổn định + cân bằng tải cho các pod
apiVersion: v1
kind: Service
metadata:
  name: flex-api-gateway
  labels:
    app: flex-api-gateway
spec:
  type: ClusterIP # chỉ trong cluster; từ máy dùng kubectl port-forward
  selector: # chọn pod theo label; lệch label -> Endpoints trống
    app: flex-api-gateway
  ports:
    - port: 80 # port của Service
      targetPort: 8080 # port của container
---
# Deployment: giữ N pod chạy, tự tạo lại khi chết, rolling update khi đổi image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flex-api-gateway
  labels:
    app: flex-api-gateway
spec:
  replicas: 1 # học/test, chưa có người dùng; tăng sau khi đo bằng kubectl top
  # Tìm pod theo label; phải khớp template.metadata.labels
  selector:
    matchLabels:
      app: flex-api-gateway
  template:
    metadata:
      labels:
        app: flex-api-gateway
    spec:
      containers:
        - name: flex-api-gateway
          image: luyenhaidangit/flex-api-gateway:1.0.1-dev # ghim version, không dùng latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: flex-api-gateway-config
            # Secret tạo lúc deploy bằng kubectl (không commit), xem README.md mục "Tạo Secret cho gateway".
            # Thiếu Secret -> Pod kẹt CreateContainerConfigError.
            - secretRef:
                name: flex-api-gateway-secret
          # Image đã chạy user không phải root (Dockerfile: USER $APP_UID); đây là lớp siết thêm ở runtime.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: # đảm bảo, dùng để chọn node
              cpu: "50m"
              memory: "96Mi"
            limits: # trần: vượt memory -> OOMKilled
              memory: "256Mi" # ước lượng, chưa đo; OOMKilled thì nâng
          # Startup: chờ app khởi động xong mới bật liveness/readiness
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24 # tối đa ~120s để khởi động
          # Readiness: lỗi -> loại khỏi Service (không restart)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3 # ~15s fail liên tục mới rút khỏi Service
            successThreshold: 1
          # Liveness: lỗi -> restart container
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3 # ~30s treo mới restart
---
# NetworkPolicy: gateway chỉ nhận traffic từ pod nginx (cổng 8080); pod khác trong cluster không gọi thẳng được.
# Chỉ có tác dụng khi CNI enforce NetworkPolicy; kubelet probe và kubectl port-forward đi từ node nên không bị chặn.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flex-api-gateway-allow-nginx
  labels:
    app: flex-api-gateway
spec:
  podSelector:
    matchLabels:
      app: flex-api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
      ports:
        - protocol: TCP
          port: 8080 # port của container (sau Service targetPort)
