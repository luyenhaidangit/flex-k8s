# ConfigMap: cấu hình không nhạy cảm, nạp vào container qua envFrom
apiVersion: v1
kind: ConfigMap
metadata:
  name: flex-api-gateway-config
  labels:
    app: flex-api-gateway
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Logging__Sinks__Logstash: "false" # chưa có Logstash; 127.0.0.1:5000 trong pod không tồn tại
  JwtSettings__Issuer: "luyenhaidangit"
  JwtSettings__Audience: "flex"
---
# Service: địa chỉ ổn định + cân bằng tải cho các pod
apiVersion: v1
kind: Service
metadata:
  name: flex-api-gateway
  labels:
    app: flex-api-gateway
spec:
  type: ClusterIP # chỉ trong cluster; từ máy dùng kubectl port-forward
  selector: # chọn pod theo label; lệch label -> Endpoints trống
    app: flex-api-gateway
  ports:
    - port: 80 # port của Service
      targetPort: 8080 # port của container
---
# Deployment: giữ N pod chạy, tự tạo lại khi chết, rolling update khi đổi image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flex-api-gateway
  labels:
    app: flex-api-gateway
spec:
  replicas: 1 # học/test, chưa có người dùng; tăng sau khi đo bằng kubectl top
  # Tìm pod theo label; phải khớp template.metadata.labels
  selector:
    matchLabels:
      app: flex-api-gateway
  template:
    metadata:
      labels:
        app: flex-api-gateway
    spec:
      containers:
        - name: flex-api-gateway
          image: luyenhaidangit/flex-api-gateway:1.0.1-dev # ghim version, không dùng latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: flex-api-gateway-config
            # Giai đoạn dev: JwtSettings__SecretKey lấy từ appsettings.json trong image, chưa dùng Secret.
            # Khi lên môi trường thật: tạo Secret lúc deploy (không commit) rồi thêm lại secretRef.
          resources:
            requests: # đảm bảo, dùng để chọn node
              cpu: "50m"
              memory: "96Mi"
            limits: # trần: vượt memory -> OOMKilled
              memory: "256Mi" # ước lượng, chưa đo; OOMKilled thì nâng
          # Startup: chờ app khởi động xong mới bật liveness/readiness
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24 # tối đa ~120s để khởi động
          # Readiness: lỗi -> loại khỏi Service (không restart)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3 # ~15s fail liên tục mới rút khỏi Service
            successThreshold: 1
          # Liveness: lỗi -> restart container
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3 # ~30s treo mới restart
